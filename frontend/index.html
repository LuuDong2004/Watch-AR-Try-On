<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TrueWrist — Thử Đồng Hồ AR</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1.5' y='1.5' width='37' height='37' rx='11' fill='%2316162A'/%3E%3Crect x='30.4' y='18.2' width='2.7' height='3.6' rx='1' fill='%23B8924A'/%3E%3Ccircle cx='20' cy='20' r='10.6' fill='none' stroke='%23B8924A' stroke-width='1.5'/%3E%3Cline x1='20' y1='20' x2='14.6' y2='14' stroke='%23B8924A' stroke-width='1.7' stroke-linecap='round'/%3E%3Cline x1='20' y1='20' x2='25.4' y2='14' stroke='%23B8924A' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='1.7' fill='%23B8924A'/%3E%3C/svg%3E"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Theme extensions used by the MediaPipe wrist try-on overlay (ported from
      // 11Exe). The .glass / .text-shimmer / .no-scrollbar component classes live
      // in src/ar/ar-tryon.css.
      tailwind.config = {
        theme: {
          extend: {
            colors: { gold: '#c8a24a' },
            // Map every font utility onto the Vietnamese-capable webfonts we load.
            // The default `serif` stack (Georgia/Times) mis-stacks Vietnamese tone
            // marks (e.g. "đồ̀", "trố́ng"), so point it at Plus Jakarta Sans/Inter.
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            },
            keyframes: {
              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              'slide-up': {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              spinslow: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.4s ease-out both',
              'slide-up': 'slide-up 0.4s ease-out both',
              shimmer: 'shimmer 1.6s linear infinite',
              spinslow: 'spinslow 1.1s linear infinite',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; }
      .font-display { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

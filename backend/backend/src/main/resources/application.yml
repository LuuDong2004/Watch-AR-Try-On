spring:
  application:
    name: truewrist-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/truewrist}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  # SMTP for outgoing email (password reset). Leave MAIL_HOST blank and
  # MAIL_ENABLED=false to run without a real mail server (links are logged).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Fail fast when the SMTP host is unreachable (some VPS providers block
          # outbound SMTP). Without these, send() blocks ~60-75s on the request
          # thread → nginx 504 without CORS headers → browser reports a CORS error.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            # Spring rejects an empty client-id, so we fall back to a placeholder
            # to let the app boot without Google login configured. Set the real
            # values in .env to enable Google sign-in.
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-set}
            scope:
              - email
              - profile
            # Spring builds the redirect URI from this template; the resulting
            # callback (http://localhost:8888/login/oauth2/code/google) must be
            # registered as an Authorized redirect URI in the Google console.
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

server:
  port: ${SERVER_PORT:8888}
  address: 0.0.0.0
  forward-headers-strategy: framework

# Application-specific settings (bound in AppProperties)
app:
  jwt:
    # Must be at least 32 bytes for HS256. Override in production via env.
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-32b+}
    # Access-token lifetime in milliseconds (default 24h).
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of allowed frontend origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5555,http://localhost:3000}
  oauth2:
    # Where the backend redirects after a successful Google login, with the
    # freshly minted JWT appended as ?token=... (frontend reads & stores it).
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:5555/auth/oauth-callback}
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:http://localhost:5555/auth/login?error=oauth}
  seed:
    # Seed demo users/shops/watches on startup if the DB is empty.
    enabled: ${SEED_ENABLED:true}
  mail:
    # Sender address for system emails.
    from: ${MAIL_FROM:TrueWrist <no-reply@truewrist.vn>}
    # Set true once SMTP is configured; otherwise reset links are only logged.
    enabled: ${MAIL_ENABLED:false}
  frontend:
    # Base URL of the SPA — reset-password links point here.
    base-url: ${FRONTEND_BASE_URL:http://localhost:5555}
  password-reset:
    # How long a reset link stays valid, in minutes.
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:60}
  sepay:
    # SePay payment gateway (https://sepay.vn). We render a VietQR (qr.sepay.vn)
    # pointing at our bank account; SePay fires a webhook when a matching transfer
    # lands. Leave SEPAY_ENABLED=false (or account/bank blank) to run in dev mode:
    # no QR + a manual "I have paid" confirm button (local dev without SePay).
    enabled: ${SEPAY_ENABLED:false}
    # Bank account that receives the transfers (registered with SePay).
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    # Bank code or short name per qr.sepay.vn/banks.json (e.g. MBBank, Vietcombank, ACB).
    bank: ${SEPAY_BANK:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    # VietQR image base + template (compact | qronly | standee | blank).
    qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    # Prefix prepended to the order code in the transfer content (e.g. TW123456).
    code-prefix: ${SEPAY_CODE_PREFIX:TW}
    # Webhook security. Preferred: HMAC-SHA256 secret (SePay signs {timestamp}.{body}
    # → X-SePay-Signature). Alternatively an API key sent as "Authorization: Apikey <key>".
    # At least one MUST be set in production — the webhook fails closed otherwise.
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  storage:
    # MinIO / S3-compatible object storage for uploaded images.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:truewrist}
    # Public base URL the frontend uses to load objects. Leave blank to reuse
    # the endpoint above. Set this when MinIO sits behind a CDN/reverse proxy.
    public-url: ${MINIO_PUBLIC_URL:}
    # Enable to skip all MinIO calls (uploads return a 503) — handy for local
    # dev without a MinIO server running.
    enabled: ${MINIO_ENABLED:true}

# Allow larger multipart bodies for image uploads.
spring.servlet.multipart:
  max-file-size: 15MB
  max-request-size: 20MB

logging:
  level:
    org.springframework.security: INFO
